# Application properties for the User Service
spring.application.name=user-service
server.port=${SERVER_PORT:8081}

# Database configuration
# Defaults preserve existing local (non-Docker) behavior; override via env vars in containers.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/book_store}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root}
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# NOTE: schema is managed manually (see revoked_tokens table required for /api/user/logout).
# If you'd rather let Hibernate create/update tables automatically for dev, uncomment:

# Security configuration
# below is generated from powershell command: [System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("VpJ6yXEOXy1cwbvTF3aVYEDgLFMuuBlAvfC3OxCNxAcvj9PK9EZ3l8JwiUn4bgjm8FOz+Ll+HkYEQ4y0S/OjiQ=="))
# NOTE: override JWT_SECRET in production/containers instead of relying on this committed value.
jwt.secret=${JWT_SECRET:VpJ6yXEOXy1cwbvTF3aVYEDgLFMuuBlAvfC3OxCNxAcvj9PK9EZ3l8JwiUn4bgjm8FOz+Ll+HkYEQ4y0S/OjiQ==}
jwt.expiration=${JWT_EXPIRATION_MILLIS:3600000}


# JWT (RS256) configuration
# Local dev: leave blank to auto-generate an ephemeral key pair (see RsaKeyProvider warning log).
# Production/Docker: set JWT_RSA_PRIVATE_KEY / JWT_RSA_PUBLIC_KEY as base64 PKCS8/X509 env vars.
jwt.rsa.private-key=${JWT_RSA_PRIVATE_KEY:}
jwt.rsa.public-key=${JWT_RSA_PUBLIC_KEY:}
jwt.rsa.key-id=${JWT_KEY_ID:user-service-key-1}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

