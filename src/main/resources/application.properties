# Application properties for the User Service
spring.application.name=user-service
server.port=8081

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/book_store
spring.datasource.username=root
spring.datasource.password=Root
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
# NOTE: schema is managed manually (see revoked_tokens table required for /api/user/logout).
# If you'd rather let Hibernate create/update tables automatically for dev, uncomment:
# spring.jpa.hibernate.ddl-auto=create

# Security configuration
# below is generated from powershell command: [System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("VpJ6yXEOXy1cwbvTF3aVYEDgLFMuuBlAvfC3OxCNxAcvj9PK9EZ3l8JwiUn4bgjm8FOz+Ll+HkYEQ4y0S/OjiQ=="))
jwt.secret=VpJ6yXEOXy1cwbvTF3aVYEDgLFMuuBlAvfC3OxCNxAcvj9PK9EZ3l8JwiUn4bgjm8FOz+Ll+HkYEQ4y0S/OjiQ==
jwt.expiration=3600000


# JWT (RS256) configuration
# Local dev: leave blank to auto-generate an ephemeral key pair (see RsaKeyProvider warning log).
# Production: set JWT_RSA_PRIVATE_KEY / JWT_RSA_PUBLIC_KEY as base64 PKCS8/X509 env vars.
jwt.rsa.private-key=
jwt.rsa.public-key=
jwt.rsa.key-id=${JWT_KEY_ID:user-service-key-1}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json

